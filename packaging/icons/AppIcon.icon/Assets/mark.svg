<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <!-- assets/icon.svg's mark, grown from its 824px tile to the whole canvas: the system draws the
       shape. Without its vertical stem, which the shipped PNGs never showed: a bounding-box
       gradient on a zero-width line paints nothing, so renderers other than actool drop it. -->
  <g transform="translate(512 512) scale(1.2427) translate(-512 -512)">
    <g fill="none" stroke="url(#ac)" stroke-width="56" stroke-linecap="round">
      <path d="M644 380 C644 520 380 500 380 620"/>
    </g>
    <circle cx="380" cy="300" r="62" fill="#141311" stroke="url(#ac)" stroke-width="44"/>
    <circle cx="380" cy="724" r="62" fill="#141311" stroke="url(#ac)" stroke-width="44"/>
    <circle cx="644" cy="340" r="62" fill="#fbbf24"/>
  </g>
</svg>
