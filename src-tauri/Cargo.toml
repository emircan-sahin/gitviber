[package]
name = "gitviber"
version = "0.1.12"
description = "A desktop git client for reviewing what your coding agents wrote."
edition = "2021"
authors = ["Emircan Sahin"]
license = "GPL-3.0-or-later"
repository = "https://github.com/emircan-sahin/gitviber"

[lib]
name = "gitviber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
# Desktop notifications on Windows and Linux, and in a dev build, which isn't an app bundle;
# a macOS bundle posts through UNUserNotificationCenter instead (notifications.rs).
tauri-plugin-notification = "=2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Gemini CLI keeps chats under its folder's SHA-256 (agents.rs); already in the tree through tauri.
sha2 = "=0.10.9"
notify = "8.2"
similar = { version = "=3.2.0", features = ["inline"] }
ureq = { version = "=3.4.2", features = ["json"] }
portable-pty = "=0.9.0"
# Go to Definition: parsers for the languages it knows (see definitions.rs).
tree-sitter = "=0.26.13"
tree-sitter-rust = "=0.24.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Update to vX in the status bar (src/lib/app/updates.ts); process relaunches into it.
tauri-plugin-updater = "=2.11.0"
tauri-plugin-process = "=2.3.1"
# Each window opens where and as large as it was left. 2.4.1: 2.5.0 needs tauri 2.12.
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(unix)'.dependencies]
# Already linked through tauri and portable-pty; stops a cancelled git with the ssh it started.
libc = "=0.2.189"

# Dependencies without debug info: a fresh target/debug went from 3.0 to 2.0 GB, per worktree.
# Our own crate keeps it, so its backtraces and breakpoints still work.
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
# A second `gitviber <path>` hands its path to the running app (opened.rs). macOS needs none:
# LaunchServices keeps one instance. 2.4.3, not the newest: a week-old release waits.
tauri-plugin-single-instance = "=2.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Same version tauri already links; reads the clipboard for the terminal's paste (clipboard.rs).
gtk = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Same version wry already links; used to lift WebKit's 60fps cap (see display.rs).
objc2 = "=0.6.4"
# Also already linked; wraps the full-screen notification handlers (see titlebar.rs) and
# UNUserNotificationCenter's completion handlers (notifications.rs).
block2 = "=0.6.2"
# The same versions wry links, so only features are added: the browser tab's own WKWebView,
# its delegates and AppKit around it (browser/macos.rs), typed where raw messages would guess.
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSArray",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSKeyValueObserving",
  "NSObject",
  "NSRunLoop",
  "NSSet",
  "NSString",
  "NSThread",
  "NSURL",
  "NSURLAuthenticationChallenge",
  "NSURLCredential",
  "NSURLProtectionSpace",
  "NSURLRequest",
  "NSURLResponse",
  "NSURLSession",
  "NSUUID",
  "NSValue",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSAlert",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSOpenPanel",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSSavePanel",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
  "WKContentWorld",
  "WKFrameInfo",
  "WKNavigation",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKOpenPanelParameters",
  "WKPreferences",
  "WKScriptMessage",
  "WKScriptMessageHandler",
  "WKSnapshotConfiguration",
  "WKUIDelegate",
  "WKUserContentController",
  "WKUserScript",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
  "WKWindowFeatures",
] }
