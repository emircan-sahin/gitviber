[package]
name = "gitviber"
version = "0.1.0"
description = "A desktop git client for reviewing what your coding agents wrote."
edition = "2021"
authors = ["Emircan Sahin"]
license = "GPL-3.0-or-later"
repository = "https://github.com/emircan-sahin/gitviber"

[lib]
name = "gitviber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
similar = { version = "=3.2.0", features = ["inline"] }
ureq = { version = "=3.4.2", features = ["json"] }
portable-pty = "=0.9.0"

[target.'cfg(unix)'.dependencies]
# Already linked through tauri and portable-pty; stops a cancelled git with the ssh it started.
libc = "=0.2.189"

# Dependencies without debug info: a fresh target/debug went from 3.0 to 2.0 GB, per worktree.
# Our own crate keeps it, so its backtraces and breakpoints still work.
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
# Same version wry already links; used to lift WebKit's 60fps cap (see display.rs).
objc2 = "=0.6.4"
# Also already linked; wraps the full-screen notification handlers (see titlebar.rs).
block2 = "=0.6.2"
