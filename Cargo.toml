[workspace]
resolver = "2"
members = ["crates/*"]
# The Tauri app stays buildable as a reference until the native app replaces it.
exclude = ["src-tauri", "vendor"]

[workspace.package]
version = "0.1.17"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Emircan Sahin"]
repository = "https://github.com/emircan-sahin/gitviber"

[workspace.dependencies]
# One feature set for every crate. Cargo unifies features only among the crates a command builds,
# so each crate asking for its own set built gpui-component and all above it again: 12 builds of
# it sat in target/ at once. The highlighter's grammars (all but SQL, whose cc pin conflicts).
gpui-kit = { version = "=0.8.0", features = [
    "tree-sitter",
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-ejs",
    "tree-sitter-elixir",
    "tree-sitter-erb",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
# Tests, examples and the off-screen snapshot share this one gpui; any other feature set would be
# another build of the whole stack.
gpui-test = { package = "gpui-pre", version = "=0.3.9", features = ["test-support", "leak-detection"] }
gpui-snapshot-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["test-support"] }
# Already in the tree through gpui-kit; pinned to the locked versions.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = "=0.4.45"
# Core's events cross to the UI thread over its channel.
futures = "=0.3.34"

# gpui-base with two changes (vendor/gpui-base/PATCH.md): closed markdown documents' shaped text
# was kept in a table swept only every 4096 entries, and the code editor gains blocks between
# lines (review notes).
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
# gpui-component with the old app's control sizes and overlay text (vendor/gpui-component/PATCH.md).
gpui-component = { path = "vendor/gpui-component" }
# gpui's Metal renderer and macOS window, giving GPU memory back: path textures sized to the
# paths, a hidden window's drawables freed, a smaller first color atlas (their PATCH.md).
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

# Line tables keep file:line in backtraces and panics; full debug info only slows the link.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The vendored crates are path packages, so cargo would build them incrementally like our own
# crates; we don't edit them day to day, and gpui-base's incremental data ran ~400 MB a build variant.
[profile.dev.package.gpui-base]
incremental = false
[profile.dev.package.gpui-component]
incremental = false
[profile.dev.package.gpui-pre-apple]
incremental = false
[profile.dev.package.gpui-pre-macos]
incremental = false

# The hot loops of the terminal and the diff, optimized even in a debug build, so a debug app
# keeps up with Claude Code's output. Built once, like any dependency.
[profile.dev.package.alacritty_terminal]
opt-level = 3
[profile.dev.package.vte]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3

# Release speed with symbols and a far quicker build than release's fat LTO: for measuring
# memory and frame times (Instruments, footprint).
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
strip = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
