[workspace]
resolver = "2"
members = ["crates/*"]
# The Tauri app stays buildable as a reference until the native app replaces it.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.17"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Emircan Sahin"]
repository = "https://github.com/emircan-sahin/gitviber"

[workspace.dependencies]
gpui-kit = "=0.8.0"
# Already in the tree through gpui-kit; pinned to the locked versions.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = "=0.4.45"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
