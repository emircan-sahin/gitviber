name: Release

# A pushed v* tag builds the app, signs and notarizes it for macOS, and leaves everything on a
# draft release that a maintainer publishes by hand (RELEASING.md). Run from the Actions tab
# it's a dry run: the same builds, unsigned, kept as workflow artifacts, and no release.
#
# The signing secrets live in the `release` environment, which only v* tags may use, so only
# the build jobs of a tag run see them. Only the publish job can write to the repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never stop a release halfway through notarizing or uploading.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE: ${{ github.event_name == 'push' }}
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails before an hour of building when the tag, the version or the notes are off.
      - id: version
        run: |
          if [ "$RELEASE" = true ]; then
            version=$(scripts/version.sh check "$GITHUB_REF_NAME")
            scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
          else
            version=$(scripts/version.sh check)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-latest
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: "1.99"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Everything that runs code from dependencies (build.rs, proc macros) happens before any
      # secret is in reach: the app for both architectures, and the updater signer. The signing
      # steps only sign what was built here.
      - name: Build
        run: |
          scripts/macos.sh build
          cargo build -p gitviber-updater --example sign --release --locked
          scripts/macos.sh app

      # The certificate goes into a keychain of its own, non-extractable, deleted with the key
      # files at the end.
      - name: Signing and notarization
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A tag must not ship a build Gatekeeper blocks; a dry run goes on without signing.
          problem() {
            if [ "$RELEASE" = true ]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1"
            echo "**Warning:** $1" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            problem "No signing certificate (the release environment's secrets reach tag runs only), so the app is ad-hoc signed and Gatekeeper will block it."
            # Ad hoc, so it at least runs on Apple Silicon after xattr -cr.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 -x \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign looks the identity up in the search list, so the keychain joins it.
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086 # one path per word
          security list-keychains -d user -s "$keychain" $existing

          identity="$APPLE_SIGNING_IDENTITY"
          if [ -z "$identity" ]; then
            identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          fi
          if [ -z "$identity" ]; then
            echo "::error::APPLE_CERTIFICATE has no Developer ID Application identity."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
            echo "NOTARIZED=true" >> "$GITHUB_ENV"
            echo "Signed, and notarized with the App Store Connect API key." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "NOTARIZED=true" >> "$GITHUB_ENV"
            echo "Signed, and notarized with the Apple ID." >> "$GITHUB_STEP_SUMMARY"
          else
            problem "Signed but not notarized: set APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_PRIVATE_KEY, or APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID."
          fi

      # The app with the hardened runtime, its ticket stapled; then the .dmg around it, signed
      # and with a ticket of its own, so opening the download doesn't ask Apple either.
      - name: Sign, notarize and pack
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The script picks the API key when its file is there, else the Apple ID.
          if [ -z "${APPLE_API_KEY_PATH:-}" ]; then unset APPLE_API_KEY APPLE_API_ISSUER; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID; fi
          scripts/macos.sh sign
          if [ "${NOTARIZED:-}" = true ]; then scripts/macos.sh notarize target/dist/macos/GitViber.app; fi
          scripts/macos.sh dmg
          if [ "${NOTARIZED:-}" = true ]; then scripts/macos.sh notarize "target/dist/macos/GitViber_${VERSION}_universal.dmg"; fi
          scripts/macos.sh updater

      - name: Check that Gatekeeper accepts it
        if: env.NOTARIZED == 'true'
        run: |
          app=target/dist/macos/GitViber.app
          dmg="target/dist/macos/GitViber_${VERSION}_universal.dmg"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      # The updater bundle carries the Tauri updater key's signature, so copies installed by the
      # Tauri-built app (tauri-plugin-updater) and by this one both take it.
      - name: Sign for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't set in the release environment; installed copies couldn't update."
              exit 1
            fi
            echo "::warning::No updater signing key, so no updater signature (.sig)."
            exit 0
          fi
          target/release/examples/sign "target/dist/macos/GitViber_${VERSION}_universal.app.tar.gz"

      - name: Collect the bundles
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          for file in target/dist/macos/GitViber_"${VERSION}"_universal.{dmg,app.tar.gz,app.tar.gz.sig}; do
            if [ -e "$file" ]; then cp "$file" "$out/"; fi
          done
          ls -l "$out"

      # Before any other action runs.
      - name: Remove the keychain and key files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: prepare
    # The oldest supported runner, so the binaries need no newer glibc than 22.04's.
    runs-on: ubuntu-22.04
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GPUI's and GTK's headers as in CI, and what the packages are made with: dpkg-dev
      # (dpkg-shlibdeps), rpm (rpmbuild), squashfs-tools (mksquashfs, for the AppImage).
      - run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libwayland-dev libfontconfig-dev libfreetype-dev dpkg-dev rpm squashfs-tools

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: "1.99"

      # No secrets here: the app, the updater signer and the bundles (.deb, .rpm, AppImage) are
      # built without the updater key; only the signer sees it, in the next step but one.
      - name: Build
        run: |
          scripts/linux.sh build
          cargo build -p gitviber-updater --example sign --release --locked
          scripts/linux.sh deb
          scripts/linux.sh rpm
          scripts/linux.sh appimage

      # Root mounts an AppImage and another user runs it (firejail, the AppImage catalog's test):
      # anything executable only for its owner inside would be "Permission denied".
      - name: Check the AppImage runs for any user
        run: |
          img=$(echo target/dist/linux/*.AppImage)
          # The modes as the image holds them: --appimage-extract makes every folder 0700 on the
          # runner image of 2026-09-27, whatever the image says.
          bad=$(unsquashfs -o "$("$img" --appimage-offset)" -lln "$img" |
            awk 'substr($1, 1, 1) ~ /[-d]/ && substr($1, 4, 1) ~ /[xs]/ && substr($1, 10, 1) !~ /[xt]/')
          if [ -n "$bad" ]; then
            # Workflow commands end at a newline; %0A keeps the list inside the annotation.
            echo "::error::Executable only for its owner inside the AppImage:%0A${bad//$'\n'/%0A}"
            exit 1
          fi

      - name: Sign for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't set in the release environment; installed copies couldn't update."
              exit 1
            fi
            echo "::warning::No updater signing key, so no updater signatures (.sig)."
            exit 0
          fi
          target/release/examples/sign target/dist/linux/*.{deb,rpm,AppImage}

      - name: Collect the bundles
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          find target/dist/linux -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.sig' \) -exec cp {} "$out/" \;
          ls -l "$out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14

  # Checksums, latest.json and the Homebrew cask, on a dry run too.
  package:
    needs: [prepare, macos, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Notes and latest.json
        if: github.event_name == 'push'
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          scripts/updater-json.sh release "$GITHUB_REF_NAME" "$VERSION" notes.md

      - name: SHA256SUMS
        run: |
          (cd release && find . -maxdepth 1 -type f ! -name latest.json ! -name SHA256SUMS -printf '%P\n' | sort | xargs -d '\n' sha256sum) > release/SHA256SUMS
          cat release/SHA256SUMS

      - name: Homebrew cask
        run: |
          sha=$(sha256sum "release/GitViber_${VERSION}_universal.dmg" | cut -d ' ' -f 1)
          sed -e '/^#/d' -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$sha/" packaging/homebrew/gitviber.rb > gitviber.rb
          {
            echo "### Homebrew cask"
            echo "Publishing the release commits this to emircan-sahin/homebrew-tap (homebrew.yml):"
            echo '```ruby'
            cat gitviber.rb
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            release/
            notes.md
            gitviber.rb
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Draft release
        run: |
          # A re-run updates its own draft; a published release is never touched.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$TAG is already published. Tag a new version."
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" release/* --clobber
          else
            flags=()
            # A test tag (v0.1.0-rc.1) must never become the release the updater serves.
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" release/* --draft --verify-tag "${flags[@]}" \
              --title "GitViber ${TAG#v}" --notes-file notes.md
          fi
          echo "Draft: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
