name: Site

# Builds site/ and deploys it to GitHub Pages. A pull request only builds it. Published releases
# redeploy too, since the download buttons link straight to that release's files. The README feeds
# llms-full.txt. Social images and icons are committed (pnpm og needs Chrome), never built here.
on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", "README.md", "pnpm-lock.yaml", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "assets/**", "README.md", "pnpm-lock.yaml", ".github/workflows/site.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a newer push replaces a queued one; an in-progress deploy finishes.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # Gives the Pages URL, which becomes a custom domain's once one is set in Settings → Pages.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: pnpm install --frozen-lockfile --filter ./site

      - run: pnpm -C site build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Only for the latest-release lookup; unauthenticated calls share a small rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
