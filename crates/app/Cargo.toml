[package]
name = "gitviber"
description = "GitViber, the native app: windows, layout, menus, palette and settings."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "gitviber_app"

[[bin]]
name = "gitviber"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
gitviber-ui = { path = "../ui" }
gitviber-core = { path = "../core" }
gitviber-diff = { path = "../diff" }
gitviber-changes = { path = "../changes" }
gitviber-terminal = { path = "../terminal" }
gitviber-files = { path = "../files" }
gitviber-history = { path = "../history" }
gitviber-refs = { path = "../refs" }
gitviber-github = { path = "../github" }

[features]
# GITVIBER_SNAPSHOT=out.png draws the main window off screen into a PNG and exits (gitviber-ui's
# `snapshot`): for checking the whole app without a window on screen. Never in a release.
snapshot = ["gitviber-ui/snapshot"]
