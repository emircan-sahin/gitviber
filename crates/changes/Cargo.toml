[package]
name = "gitviber-changes"
description = "GitViber's Changes panel: the uncommitted files, staging, the commit box, stashes, and their diff tabs."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "gitviber_changes"

[dependencies]
gitviber-core = { path = "../core" }
gitviber-ui = { path = "../ui" }
gitviber-diff = { path = "../diff" }
gpui-kit.workspace = true

[dev-dependencies]
gitviber-ui = { path = "../ui", features = ["snapshot"] }
# Leak tests: gpui's test platform and its handle bookkeeping, which gpui-kit's features leave out.
gpui-test.workspace = true

# Every crate's example shares target/debug/examples/: a plain "demo" would be overwritten.
[[example]]
name = "changes-demo"
path = "examples/demo.rs"
