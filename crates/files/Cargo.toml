[package]
name = "gitviber-files"
description = "GitViber's files: the explorer, search in files, quick open, the file view and media."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "gitviber_files"

[dependencies]
# The code editor's grammars: gpui-component's own optional ones, the same set the diff enables.
gpui-kit.workspace = true
gitviber-core = { path = "../core" }
gitviber-ui = { path = "../ui" }
gitviber-markdown = { path = "../markdown" }
gitviber-diff = { path = "../diff" }
# Already in the tree through gpui: an image's size from its header (media.rs).
image = { version = "=0.25.10", default-features = false }
# Already in the tree through gpui-component's editor: Go to Definition's locations.
lsp-types = "=0.97.0"

[dev-dependencies]
gitviber-ui = { path = "../ui", features = ["snapshot"] }
# Leak tests: gpui's test platform and its handle bookkeeping, which gpui-kit's features leave out.
gpui-test.workspace = true

[[example]]
name = "files-demo"
path = "examples/demo.rs"

[[example]]
name = "files-mem-probe"
path = "examples/mem_probe.rs"
