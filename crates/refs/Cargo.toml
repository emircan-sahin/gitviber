[package]
name = "gitviber-refs"
description = "GitViber's branches, worktrees, tags and the top bar's git actions: pickers, dialogs, sync and undo."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "gitviber_refs"

[dependencies]
gitviber-core = { path = "../core" }
gitviber-ui = { path = "../ui" }
gpui-kit.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Leak tests: gpui's test platform and its handle bookkeeping, which gpui-kit's features leave out.
gpui-test.workspace = true

# Every crate's example shares target/debug/examples/: a plain "demo" would be overwritten.
[[example]]
name = "refs-demo"
path = "examples/demo.rs"
