[package]
name = "gitviber-terminal"
description = "GitViber's terminal: VT emulation, a GPUI grid renderer, and the panel's tabs and splits."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "gitviber_terminal"

[dependencies]
gitviber-core = { path = "../core" }
gitviber-ui = { path = "../ui" }
# Worktree events (new, open terminal, resume) come from it; it asks how many terminals run in one.
gitviber-refs = { path = "../refs" }
# Links open files and folders (the explorer) through it.
gitviber-files = { path = "../files" }
gpui-kit.workspace = true
# The session save (terminals.json) and its agents.
serde.workspace = true
serde_json.workspace = true
# VT parsing, grid, scrollback, modes, selection and search; core owns the PTY.
alacritty_terminal = "=0.26.0"
# A link's host as a browser reads it; core's own version.
url = "=2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock badge (NSApp.dockTile), as core's own raw messages.
objc2 = "=0.6.4"

[[example]]
name = "terminal-demo"
path = "examples/demo.rs"

[dev-dependencies]
# The example's off-screen picture (dev::run with GITVIBER_SNAPSHOT).
gitviber-ui = { path = "../ui", features = ["snapshot"] }
# Leak tests: gpui's test platform and its handle bookkeeping, which gpui-kit's features leave out.
gpui-test.workspace = true
# The stress test (src/stress) draws off screen with the real text system and renderer, and its fake
# agent sets up its tty itself; all already in the tree.
gpui-snapshot-platform.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = { version = "=0.3.9", features = ["font-kit"] }
libc = "=0.2.189"
