[package]
name = "gitviber-github"
description = "GitViber's GitHub views: pull requests, issues, checks and the account they're read with."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "gitviber_github"

[dependencies]
gpui-kit.workspace = true
gitviber-core = { path = "../core" }
gitviber-ui = { path = "../ui" }
gitviber-diff = { path = "../diff" }
gitviber-markdown = { path = "../markdown" }
# Bridges: the branch pickers' pull request, History's commit checks, worktrees for a PR or an issue.
gitviber-refs = { path = "../refs" }
gitviber-history = { path = "../history" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# NFKD for an issue's branch name (logic/issue_work.rs); already in the tree through url's idna.
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }

[[example]]
name = "github-demo"
path = "examples/demo.rs"

[dev-dependencies]
# Off-screen pictures of the demo (dev::run with GITVIBER_SNAPSHOT).
gitviber-ui = { path = "../ui", features = ["snapshot"] }
# Leak tests: gpui's test platform and its handle bookkeeping, which gpui-kit's features leave out.
gpui-test.workspace = true
