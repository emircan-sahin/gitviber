<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitViber</title>
    <!-- A reload (⌘R) paints before any CSS or module loads: start on the theme's color, not
         white. Mirrors settings.ts (appearance) and index.css (body's --sidebar). -->
    <style>
      html { background: #0e0e0f; }
      html[data-theme="dim"] { background: #1c1c1f; }
      html[data-theme="light"] { background: #f3f3f4; }
    </style>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("gitviber.settings.v2") || "{}");
        var theme = saved.appearance;
        if (theme !== "light" && theme !== "dark" && theme !== "dim")
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : saved.darkVariant === "dim" ? "dim" : "dark";
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
